name: world audition preview validation
on:
  pull_request:
    paths:
      - 'public/world-audition/**'
      - 'tests/world-audition-*.mjs'
      - '.github/workflows/world-audition-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate stored payloads and publication boundary
        run: node tests/world-audition-package.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Gardens Lab adapter eliminates nested worker 404
        timeout-minutes: 4
        run: GARDENS_EXPECT_ADAPTER=1 node tests/world-audition-gardens-forensics.mjs
      - name: Preserve Gardens adapter regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-audition-gardens-forensics
          path: test-results/world-audition-gardens-forensics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke-test served preview through real Chromium WebGL
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/world-audition-http.log 2>&1 &
          node tests/world-audition-browser.mjs
      - name: Run protected review-import regression tests
        run: node --test tests/world-audition-review-import.test.mjs
      - name: Observe all 21 startup/WebGL paths (diagnostic, not a release gate)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory public > /tmp/world-audition-evidence-http.log 2>&1 &
          evidence_server=$!
          trap 'kill "$evidence_server" 2>/dev/null || true' EXIT
          WORLD_AUDITION_URL=http://127.0.0.1:8767/world-audition/ node tests/world-audition-evidence.mjs
      - name: Preserve observed startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-audition-startup-evidence
          path: test-results/world-audition-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prove Pages build can host the Lab at the demo repository base
        env:
          VITE_PUBLIC_BASE: /museum_demos/
          MUSEUM_BUILD_SHA: ${{ github.sha }}
          MUSEUM_BUILD_REF: ${{ github.ref_name }}
        run: |
          npm run build:pages
          npm run verify:pages-dist
          node tests/world-audition-pages.mjs